version: "3.9"

services:
  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run start:prod"
    ports:
      - "8098:3001"
    env_file: .env.backend
    environment:
      API_URL: "http://localhost:8098/api/v1"
      VAPID_PUBLIC_KEY: "BNmas-sTgL2czxhDmQ7yvSMQ4X9X_LbUYyExcB_5e6XnUMy091FPpIUhQNuKSsfWleYSHUBT0BGqVdec4tqfGOc"
      SENTRY_DSN: ""
    volumes:
      - ./:/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8099:80"
    environment:
      API_URL: "http://localhost:8098/api/v1"
      VAPID_PUBLIC_KEY: "BNmas-sTgL2czxhDmQ7yvSMQ4X9X_LbUYyExcB_5e6XnUMy091FPpIUhQNuKSsfWleYSHUBT0BGqVdec4tqfGOc"
      SENTRY_DSN: ""
    restart: unless-stopped
