
        
        <div class="max-w-3xl mx-auto px-4 py-16">
            <h1 class="text-3xl font-black mb-8 text-center">Contactez-nous</h1>
            <form class="bg-white p-8 rounded-xl shadow-sm border border-gray-100" (ngSubmit)="onSubmit()" *ngIf="!success">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nom complet</label>
                    <input type="text" name="nom" [(ngModel)]="formData.nom" required class="w-full border-gray-300 rounded-md shadow-sm p-3 border focus:ring-brand-green focus:border-brand-green">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email ou Téléphone</label>
                    <input type="text" name="telephone" [(ngModel)]="formData.telephone" required class="w-full border-gray-300 rounded-md shadow-sm p-3 border focus:ring-brand-green focus:border-brand-green">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                    <textarea rows="4" name="message" [(ngModel)]="formData.message" required class="w-full border-gray-300 rounded-md shadow-sm p-3 border focus:ring-brand-green focus:border-brand-green"></textarea>
                </div>
                <!-- Message d'erreur personnalisé -->
                <div *ngIf="errorMsg" class="mb-4 bg-red-50 border border-red-200 text-red-600 px-5 py-4 rounded-xl flex items-start sm:items-center gap-3 animate-fade-in-up">
                    <i class="fa-solid fa-circle-exclamation text-xl mt-0.5 sm:mt-0 text-red-500"></i>
                    <span class="font-medium text-sm leading-snug">{{ errorMsg }}</span>
                </div>
                <button type="submit" [disabled]="isSubmitting" class="w-full bg-brand-green text-white font-bold py-3 rounded-lg hover:bg-brand-dark disabled:opacity-50">
                    <span *ngIf="!isSubmitting">Envoyer</span>
                    <span *ngIf="isSubmitting">Envoi en cours...</span>
                </button>
            </form>
            <div class="bg-green-50 border-2 border-green-500 p-6 rounded-2xl text-center" *ngIf="success">
                <h3 class="text-2xl font-black text-gray-900 mb-2">Message Envoyé !</h3>
                <p class="text-gray-600">Nous vous répondrons dans les plus brefs délais.</p>
            </div>
        </div>
