
        
        <div class="max-w-3xl mx-auto px-4 py-16">
            <div class="text-center mb-8">
                <div class="w-16 h-16 mx-auto bg-brand-green text-white rounded-full flex items-center justify-center text-2xl mb-4"><i class="fa-solid fa-lightbulb"></i></div>
                <h1 class="text-3xl font-black">Proposer une idée</h1>
                <p class="text-gray-600 mt-2">Soumettez votre projet pour enrichir le programme du mouvement.</p>
            </div>
            <form class="bg-white p-8 rounded-xl shadow-sm border border-gray-100" (ngSubmit)="onSubmit()" *ngIf="!success">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Titre de votre proposition <span class="text-red-500">*</span></label>
                    <input type="text" name="titre" [(ngModel)]="formData.titre" required class="w-full border-gray-300 rounded-md shadow-sm p-3 border focus:ring-brand-green focus:border-brand-green">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Axe concerné</label>
                    <select name="axe_concerne" [(ngModel)]="formData.axe_concerne" required class="w-full border-gray-300 rounded-md shadow-sm p-3 border focus:ring-brand-green focus:border-brand-green">
                        <option value="Éducation et formation">Éducation et formation</option>
                        <option value="Emploi et entrepreneuriat">Emploi et entrepreneuriat</option>
                        <option value="Jeunesse, sport et culture">Jeunesse, sport et culture</option>
                        <option value="Environnement et cadre de vie">Environnement et cadre de vie</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Détails de la solution proposée <span class="text-red-500">*</span></label>
                    <textarea name="description" [(ngModel)]="formData.description" required rows="5" class="w-full border-gray-300 rounded-md shadow-sm p-3 border focus:ring-brand-green focus:border-brand-green"></textarea>
                </div>
                <!-- Message d'erreur personnalisé -->
                <div *ngIf="errorMsg" class="mb-4 bg-red-50 border border-red-200 text-red-600 px-5 py-4 rounded-xl flex items-start sm:items-center gap-3 animate-fade-in-up">
                    <i class="fa-solid fa-circle-exclamation text-xl mt-0.5 sm:mt-0 text-red-500"></i>
                    <span class="font-medium text-sm leading-snug">{{ errorMsg }}</span>
                </div>
                <button type="submit" [disabled]="isSubmitting" class="w-full bg-brand-green text-white font-bold py-3 rounded-lg hover:bg-brand-dark disabled:opacity-50">
                    <span *ngIf="!isSubmitting">Envoyer ma proposition</span>
                    <span *ngIf="isSubmitting">Envoi en cours...</span>
                </button>
            </form>
            <div class="bg-green-50 border-2 border-green-500 p-8 rounded-3xl text-center shadow-lg animate-fade-in-up" *ngIf="success">
                <div class="w-20 h-20 bg-green-500 text-white rounded-full flex items-center justify-center text-4xl mx-auto mb-5 shadow-[0_0_20px_rgba(34,197,94,0.4)]">
                    <i class="fa-solid fa-lightbulb"></i>
                </div>
                <h3 class="text-3xl font-black text-gray-900 mb-3">Idée Envoyée !</h3>
                <p class="text-gray-600 text-lg font-medium mb-6">Merci de votre contribution, votre idée a bien été reçue par l'équipe JÀMM AK XÉEWAL.</p>
                <button (click)="resetForm()" type="button" class="px-6 py-3 bg-[#022c16] text-white font-bold rounded-xl shadow-md hover:bg-[#022c16]/90 transition-colors inline-flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Proposer une autre idée
                </button>
            </div>
        </div>
