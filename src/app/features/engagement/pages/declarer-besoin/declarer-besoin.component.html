
        
    <!-- Premium Internal Hero -->
    <div class="relative bg-brand-dark overflow-hidden pt-8 pb-14 md:pt-10 md:pb-20 border-b border-brand-green/20">
        <!-- Background effects -->
        <div class="absolute inset-0 opacity-[0.05] bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] mix-blend-overlay"></div>
        <div class="absolute top-0 right-0 w-[600px] h-[600px] bg-brand-green/20 rounded-full blur-[100px] -translate-y-1/2 translate-x-1/3 pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-brand-yellow/10 rounded-full blur-[80px] translate-y-1/3 -translate-x-1/3 pointer-events-none"></div>
        
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center flex flex-col items-center">
            
            <!-- Breadcrumbs -->
            <nav class="flex justify-center mb-2" aria-label="Breadcrumb">
                <ol class="inline-flex items-center space-x-1 md:space-x-2 bg-white/5 backdrop-blur-md px-3 py-1 rounded-full border border-white/10 shadow-sm">
                    <li class="inline-flex items-center">
                        <a routerLink="/" class="inline-flex items-center text-[10px] md:text-xs font-medium text-gray-200 hover:text-white transition-colors">
                            <i class="fa-solid fa-house mr-1"></i> Accueil
                        </a>
                    </li>
                    <li>
                        <div class="flex items-center">
                            <i class="fa-solid fa-chevron-right text-gray-500 text-[8px] mx-1"></i>
                            <span class="text-[10px] md:text-xs font-bold text-white drop-shadow-sm">Déclarer un besoin</span>
                        </div>
                    </li>
                </ol>
            </nav>
            
            <h1 class="text-2xl md:text-3xl font-black text-white mb-1.5 tracking-tight drop-shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-bullhorn text-brand-yellow text-xl md:text-2xl"></i> Signaler un <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-yellow to-yellow-300 drop-shadow-none">Problème</span>
            </h1>
            <p class="text-gray-300 text-xs md:text-sm max-w-xl mx-auto font-medium leading-tight">
                Faites remonter les difficultés de votre quartier pour que nous puissions agir ensemble.
            </p>
        </div>
    </div>

    <!-- Container du Formulaire en lévitation -->
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 relative -mt-10 md:-mt-14 z-20 pb-16">
        
        <form class="relative max-w-3xl mx-auto" (ngSubmit)="onSubmit()" *ngIf="!success">
            
            <!-- Ligne Verticale (Timeline) -->
            <div class="absolute left-6 md:left-8 top-12 bottom-32 w-1.5 bg-gray-200 rounded-full z-0 hidden md:block"></div>
            <!-- Ligne de complétion (décorative) -->
            <div class="absolute left-6 md:left-8 top-12 h-[50%] w-1.5 bg-gradient-to-b from-brand-yellow to-brand-green rounded-full z-0 hidden md:block opacity-50"></div>

            <!-- Étape 1 : Le Besoin -->
            <div class="relative mb-10 group">
                <!-- Point Timeline (Desktop) -->
                <div class="absolute left-6 md:left-8 top-10 w-12 h-12 bg-white rounded-full border-[4px] border-brand-yellow shadow-[0_0_15px_rgba(245,158,11,0.3)] flex items-center justify-center text-brand-yellow font-black text-xl z-10 -translate-x-1/2 -translate-y-1/2 hidden md:flex transition-transform group-hover:scale-110">1</div>
                
                <!-- Carte -->
                <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow md:ml-16">
                    <h3 class="text-xl font-black text-brand-dark mb-6 flex items-center gap-3">
                        <span class="md:hidden bg-brand-yellow text-white w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-sm">1</span> 
                        De quoi s'agit-il ?
                    </h3>
                    
                    <div class="space-y-6">
                        <div>
                            <label class="block text-gray-800 font-extrabold mb-3 text-sm uppercase tracking-wide">Expliquez-nous le problème <span class="text-red-500">*</span></label>
                            
                            <!-- Text Input Container (Hidden by default) -->
                            <div class="w-full transition-all relative">
                                <textarea name="description" [(ngModel)]="formData.description" required rows="2" class="w-full border border-gray-200 rounded-xl p-3 bg-gray-50/50 focus:bg-white focus:outline-none focus:border-brand-green text-sm transition-all resize-none placeholder-gray-400" placeholder="Décrivez la situation en détail..."></textarea>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-1 gap-4 pt-3 border-t border-gray-100">
                            <div>
                                <label for="quartier" class="block text-gray-800 font-extrabold mb-2 text-sm uppercase tracking-wide">Dans quel quartier ? <span class="text-red-500">*</span></label>
                                <div class="relative">
                                    <select id="quartier" name="quartier" [(ngModel)]="formData.quartier" required class="w-full border-2 border-gray-100 rounded-xl p-3 bg-gray-50/50 focus:bg-white focus:outline-none focus:border-brand-green focus:ring-4 focus:ring-brand-green/20 text-base text-gray-700 transition-all appearance-none cursor-pointer">
                                        <option value="">Sélectionnez votre quartier...</option>
                                        <option value="Nguinth">Nguinth</option>
                                        <option value="Grand Thiès">Grand Thiès</option>
                                        <option value="Keur Mame El Hadj">Keur Mame El Hadj</option>
                                        <option value="Médina Fall">Médina Fall</option>
                                        <option value="Som">Som</option>
                                    </select>
                                    <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Étape 2 : Contact -->
            <div class="relative mb-10 group">
                <div class="absolute left-6 md:left-8 top-10 w-12 h-12 bg-white rounded-full border-[4px] border-brand-green shadow-[0_0_15px_rgba(0,141,54,0.2)] flex items-center justify-center text-brand-green font-black text-xl z-10 -translate-x-1/2 -translate-y-1/2 hidden md:flex transition-transform group-hover:scale-110">2</div>
                
                <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow md:ml-16">
                    <h3 class="text-xl font-black text-brand-dark mb-6 flex items-center gap-3">
                        <span class="md:hidden bg-brand-green text-white w-8 h-8 rounded-full flex items-center justify-center text-sm shadow-sm">2</span> 
                        Comment vous joindre ?
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label for="nom" class="block text-gray-800 font-extrabold mb-2 text-sm uppercase tracking-wide">Votre nom <span class="text-gray-400 font-normal lowercase">(optionnel)</span></label>
                            <input id="nom" name="nom" [(ngModel)]="formData.nom_citoyen" type="text" class="w-full border-2 border-gray-100 rounded-xl p-3 bg-gray-50/50 focus:bg-white focus:outline-none focus:border-brand-green focus:ring-4 focus:ring-brand-green/20 text-base transition-all" placeholder="Nom ou prénom">
                        </div>
                        <div>
                            <label for="telephone" class="block text-gray-800 font-extrabold mb-2 text-sm uppercase tracking-wide">Téléphone <span class="text-red-500">*</span></label>
                            <div class="relative">
                                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 font-bold border-r border-gray-200 pr-2">+221</span>
                                <input id="telephone" name="telephone" [(ngModel)]="formData.telephone_citoyen" required type="tel" class="w-full border-2 border-gray-100 rounded-xl p-3 pl-20 bg-gray-50/50 focus:bg-white focus:outline-none focus:border-brand-green focus:ring-4 focus:ring-brand-green/20 text-base transition-all font-bold tracking-wider" placeholder="77 123 45 67">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bouton -->
            <div class="md:ml-16 mt-2 relative z-10">
                <button type="submit" [disabled]="isSubmitting" class="w-full bg-gradient-to-r from-brand-yellow to-yellow-400 text-brand-dark text-lg font-black py-4 rounded-2xl shadow-lg hover:shadow-[0_15px_30px_-10px_rgba(245,158,11,0.5)] transition-all transform hover:-translate-y-1 uppercase tracking-widest flex items-center justify-center gap-3 disabled:opacity-50">
                    <span *ngIf="!isSubmitting">Envoyer le signalement <i class="fa-solid fa-paper-plane text-xl"></i></span>
                    <span *ngIf="isSubmitting"><i class="fa-solid fa-circle-notch fa-spin"></i> Envoi en cours...</span>
                </button>
            </div>
        </form>

        <div class="md:ml-16 mt-6 relative z-10 bg-green-50 border-2 border-green-500 p-6 rounded-2xl text-center" *ngIf="success">
            <h3 class="text-2xl font-black text-gray-900 mb-2">Signalement Envoyé !</h3>
            <p class="text-gray-600">Votre besoin a bien été transmis. Nous allons l'étudier rapidement.</p>
        </div>

    </div>
