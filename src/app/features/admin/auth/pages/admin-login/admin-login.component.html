<div class="min-h-screen relative flex items-center justify-center md:justify-end p-4 md:p-12 lg:p-24 bg-slate-900">
  <!-- Background Image with Gradient Overlay -->
  <div class="absolute inset-0 z-0">
    <img src="assets/image.png" alt="Background" class="w-full h-full object-cover" />
    <!-- Gradient overlay: clear on the left, dark on the right behind the form -->
    <div class="absolute inset-0 bg-gradient-to-r from-slate-900/40 via-slate-900/60 to-slate-900/95"></div>
  </div>

  <div class="relative z-10 w-full max-w-md md:-translate-y-[30px] md:translate-x-[45px]">


    <div class="relative p-[2px] rounded-[2rem] bg-gradient-to-br from-brand-greenLight/60 via-brand-green/10 to-transparent shadow-[0_0_40px_rgba(0,141,54,0.15)]">
      <div class="bg-white rounded-[calc(2rem-2px)] p-8 sm:p-10 min-h-[500px] flex flex-col justify-center relative overflow-hidden">
        <!-- Subtle inner glow -->
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-brand-green/5 rounded-full blur-3xl pointer-events-none"></div>
        
        <form (submit)="onSubmit($event)" class="space-y-6 relative z-10">
        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fa-regular fa-envelope text-slate-400"></i>
            </div>
            <input
              type="email"
              [(ngModel)]="email"
              name="email"
              required
              placeholder="admin@jammakxeewal.org"
              class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-green/20 focus:border-brand-green transition-all"
            />
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Mot de passe</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fa-solid fa-lock text-slate-400"></i>
            </div>
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              required
              placeholder="••••••••"
              class="w-full pl-10 pr-12 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-green/20 focus:border-brand-green transition-all"
            />
            <button
              type="button"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 transition-colors"
            >
              <i [class]="showPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye'"></i>
            </button>
          </div>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="flex items-center gap-2 p-3 bg-red-50 border border-red-100 rounded-xl">
          <i class="fa-solid fa-circle-exclamation text-red-500 text-sm"></i>
          <span class="text-sm text-red-600">{{ errorMessage }}</span>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full py-3 px-4 bg-gradient-to-r from-brand-green to-brand-greenLight text-white font-semibold rounded-xl hover:from-brand-greenLight hover:to-brand-green focus:outline-none focus:ring-2 focus:ring-brand-green/50 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 shadow-lg shadow-brand-green/25"
        >
          <i *ngIf="isLoading" class="fa-solid fa-circle-notch fa-spin"></i>
          <span>{{ isLoading ? 'Connexion...' : 'Se connecter' }}</span>
        </button>
      </form>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-slate-500 text-xs mt-6">
      © 2026 JÀMM AK XÉEWAL — Tous droits réservés
    </p>
  </div>
</div>
