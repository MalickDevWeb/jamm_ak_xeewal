<div class="min-h-screen bg-[#022c16] flex items-center justify-center relative overflow-hidden">
    <!-- Image de fond en plein écran -->
    <div class="absolute inset-0 bg-[url('assets/image.png')] bg-cover bg-center md:bg-right bg-no-repeat"></div>

    <!-- Overlay léger pour mobile afin de s'assurer que le formulaire soit lisible si l'image est zoomée -->
    <div class="absolute inset-0 bg-black/30 md:bg-transparent"></div>

    <!-- Conteneur du formulaire aligné sur la droite pour recouvrir la carte blanche de l'image -->
    <div class="relative z-10 w-[50] max-w-[600px] px-1 md:ml-auto md:mr-8 lg:mr-16 xl:mr-24">

        <!-- Carte Formulaire -->
        <div class="bg-white p-8 sm:p-12 rounded-[3rem] shadow-2xl w-full min-h-[750px] flex flex-col justify-center border border-gray-100">

            <!-- Icône d'utilisateur (similaire à celle sur l'image) -->
            <div class="flex justify-center mb-8">
                <div class="w-16 h-16 bg-[#e6f4ea] rounded-3xl flex items-center justify-center shadow-inner">
                    <i class="fa-solid fa-user text-[#022c16] text-2xl"></i>
                </div>
            </div>

            <!-- Affichage des erreurs -->
            <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 border border-red-100 rounded-xl flex items-start gap-3 animate-fade-in">
                <i class="fa-solid fa-circle-exclamation text-red-500 mt-0.5"></i>
                <p class="text-sm text-red-600 font-medium">{{ errorMessage }}</p>
            </div>

            <form class="space-y-6" (submit)="onSubmit($event)">

                <!-- Email -->
                <div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <input id="email" name="email" type="email" [(ngModel)]="email" required placeholder="Email"
                               class="block w-full pl-12 pr-4 py-4 border-2 border-gray-100 rounded-2xl focus:ring-0 focus:border-[#022c16] text-base font-medium transition-all bg-gray-50 focus:bg-white text-gray-800 placeholder-gray-400">
                    </div>
                </div>

                <!-- Mot de passe -->
                <div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input id="password" name="password" type="password" [(ngModel)]="password" required placeholder="Mot de passe"
                               class="block w-full pl-12 pr-12 py-4 border-2 border-gray-100 rounded-2xl focus:ring-0 focus:border-[#022c16] text-base font-medium transition-all bg-gray-50 focus:bg-white text-gray-800 placeholder-gray-400">
                    </div>
                </div>

                <!-- Bouton de connexion -->
                <button type="submit" [disabled]="isLoading"
                        class="w-full py-4 px-6 rounded-2xl shadow-lg shadow-[#022c16]/30 text-white bg-[#022c16] hover:bg-[#034423] focus:outline-none focus:ring-4 focus:ring-offset-2 focus:ring-[#022c16]/50 font-black text-lg transition-all flex items-center justify-center disabled:opacity-70 disabled:cursor-not-allowed mt-8 uppercase tracking-wide">
                    <span *ngIf="!isLoading">Se connecter</span>
                    <i *ngIf="isLoading" class="fa-solid fa-circle-notch fa-spin"></i>
                </button>
            </form>
        </div>
    </div>
</div>
