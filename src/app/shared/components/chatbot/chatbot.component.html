<!-- Chatbot Citoyen -->
<button (click)="toggleChat()" id="chatbot-toggle" class="fixed bottom-6 right-6 w-16 h-16 bg-brand-green text-white rounded-full shadow-2xl flex items-center justify-center text-2xl hover:scale-110 hover:bg-brand-dark transition-all z-50" style="z-index: 99999;">
    <i class="fa-solid fa-comments"></i>
</button>

<!-- Chatbot Window -->
<div id="chatbot-window" [class.hidden]="!isOpen" class="fixed bottom-28 right-6 w-80 sm:w-96 bg-white rounded-2xl shadow-2xl border border-gray-100 z-[100] flex flex-col overflow-hidden transition-all duration-300">
    <!-- Header -->
    <div class="bg-brand-dark text-white p-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center shadow-inner">
                <i class="fa-solid fa-robot text-brand-yellow"></i>
            </div>
            <div>
                <h4 class="font-bold text-sm">Assistant JÀMM</h4>
                <span class="text-xs text-brand-green flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-brand-green animate-pulse"></span> En ligne</span>
            </div>
        </div>
        <button (click)="closeChat()" id="chatbot-close" class="text-gray-400 hover:text-white transition-colors p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    
    <!-- Messages Area -->
    <div #messagesContainer id="chatbot-messages" class="p-4 h-80 overflow-y-auto bg-gray-50 flex flex-col gap-4">
        
        <div *ngFor="let msg of messages" [ngClass]="msg.isUser ? 'flex gap-2 justify-end' : 'flex gap-2'">
            <div *ngIf="!msg.isUser" class="w-8 h-8 rounded-full bg-brand-dark text-brand-yellow flex shrink-0 items-center justify-center text-xs mt-1"><i class="fa-solid fa-robot"></i></div>
            
            <div [ngClass]="msg.isUser ? 'bg-brand-green text-white p-3.5 rounded-2xl rounded-tr-none shadow-sm text-sm max-w-[85%]' : 'bg-white p-3.5 rounded-2xl rounded-tl-none shadow-sm text-sm text-gray-700 border border-gray-100 max-w-[85%]'">
                {{ msg.text }}
            </div>
        </div>

        <!-- Quick actions, only show if there's just the initial message -->
        <div *ngIf="messages.length === 1" class="flex flex-wrap gap-2 ml-10">
            <a routerLink="/adherer" class="text-xs bg-brand-green/10 text-brand-green border border-brand-green/20 px-3 py-1.5 rounded-full hover:bg-brand-greenLight hover:text-white transition-colors cursor-pointer">Comment adhérer ?</a>
            <a routerLink="/declarer-besoin" class="text-xs bg-brand-green/10 text-brand-green border border-brand-green/20 px-3 py-1.5 rounded-full hover:bg-brand-greenLight hover:text-white transition-colors cursor-pointer">Déclarer un besoin</a>
        </div>
    </div>
    
    <!-- Input Area -->
    <div class="p-3 bg-white border-t border-gray-100 flex items-center gap-2">
        <input [(ngModel)]="inputText" (keypress)="onKeyPress($event)" type="text" placeholder="Écrivez votre message..." class="flex-grow bg-gray-50 border border-gray-200 rounded-full px-4 py-2.5 text-sm focus:outline-none focus:border-brand-green focus:bg-white transition-colors">
        <button (click)="sendMessage()" class="w-10 h-10 rounded-full bg-brand-yellow text-brand-dark flex shrink-0 items-center justify-center hover:bg-brand-yellowDark transition-colors shadow-sm">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>
</div>
