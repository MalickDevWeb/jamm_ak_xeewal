<div *ngIf="showPrompt" @slideDown class="fixed top-0 left-0 w-full z-[100] p-4 pointer-events-none">
  <div class="max-w-3xl mx-auto bg-white/95 backdrop-blur-md shadow-2xl rounded-2xl p-5 md:p-6 border border-gray-100 flex flex-col md:flex-row items-center gap-4 md:gap-6 pointer-events-auto transform transition-all relative overflow-hidden">
    
    <!-- Effet de brillance/décoration -->
    <div class="absolute top-0 left-0 w-1 h-full bg-[#E5B50A]"></div>
    
    <!-- Icône -->
    <div class="w-12 h-12 rounded-full bg-[#022c16]/10 flex items-center justify-center shrink-0">
      <i class="fa-solid fa-bell text-2xl text-[#E5B50A]"></i>
    </div>

    <!-- Texte -->
    <div class="flex-grow text-center md:text-left">
      <h3 class="text-lg font-bold text-[#022c16] mb-1">Restez connecté(e) au mouvement !</h3>
      <p class="text-gray-600 text-sm">Activez les notifications pour recevoir les dernières alertes, activités et urgences de JÀMM AK XÉEWAL en temps réel.</p>
    </div>

    <!-- Boutons -->
    <div class="flex items-center gap-3 w-full md:w-auto shrink-0 mt-2 md:mt-0">
      <button 
        (click)="dismiss()"
        class="flex-1 md:flex-none px-4 py-2.5 rounded-xl font-medium text-gray-500 hover:bg-gray-100 transition-colors text-sm">
        Plus tard
      </button>
      <button 
        (click)="subscribe()"
        class="flex-1 md:flex-none px-6 py-2.5 rounded-xl font-medium text-white bg-[#022c16] hover:bg-[#034020] transition-colors shadow-lg shadow-[#022c16]/20 text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-check"></i>
        Activer
      </button>
    </div>
  </div>
</div>
