<div class="relative" (click)="$event.stopPropagation()">
  <!-- Combobox Input -->
  <input type="text" 
         [(ngModel)]="searchQuery" 
         (focus)="onFocus()"
         (input)="onInput()"
         [placeholder]="placeholder"
         class="w-full pl-5 pr-10 py-3.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#00a651]/20 focus:border-[#00a651] text-[15px] font-medium bg-white transition-all shadow-sm text-gray-800 placeholder-gray-400"
         autocomplete="off">
  
  <button type="button" (click)="toggleDropdown($event)" aria-label="Ouvrir la liste des quartiers" class="absolute inset-y-0 right-0 px-4 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none z-10">
      <i class="fa-solid fa-chevron-down text-sm transition-transform duration-200" [class.rotate-180]="isOpen"></i>
  </button>

  <!-- Menu déroulant (Options) -->
  <div *ngIf="isOpen" 
       class="absolute z-50 w-full mt-2 bg-white border border-gray-100 rounded-xl shadow-2xl overflow-hidden animate-fade-in-up flex flex-col"
       style="max-h: 320px;">
    
    <div class="overflow-y-auto scrollbar-thin scrollbar-thumb-gray-200 flex-grow py-1">
        <button *ngFor="let q of filteredQuartiers" type="button" 
                (click)="selectOption(q)"
                class="w-full text-left px-5 py-4 hover:bg-gray-50 cursor-pointer transition-colors text-[15px] font-medium flex items-center gap-3 active:bg-gray-100 border-b border-gray-50 last:border-0"
                [ngClass]="value === getOptionValue(q) ? 'text-[#022c16] font-bold bg-gray-50' : 'text-[#2D3748]'">
            <i class="fa-solid fa-location-dot text-[#ffb000]"></i>
            {{ q.label }}
            <i class="fa-solid fa-check ml-auto text-[#00a651]" *ngIf="value === getOptionValue(q)"></i>
        </button>

        <div *ngIf="filteredQuartiers.length === 0" class="p-6 text-center text-gray-400 text-sm">
            <i class="fa-solid fa-face-frown-open text-2xl mb-2 opacity-50 block"></i>
            Aucun quartier ne correspond à votre recherche.
        </div>
    </div>
  </div>
</div>
